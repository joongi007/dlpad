name: Introduction site

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/*site*', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'scripts/*site*', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'release' && 'refs/heads/main' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
      - run: python3 scripts/test_build_site.py
      - name: Build only public website files
        run: python3 scripts/build_site.py --fetch-releases --output public-site
      - name: Preserve reviewable website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: introduction-site-${{ github.sha }}
          path: public-site/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload Pages bundle after publication is enabled
        if: github.event_name != 'pull_request' && vars.DLPAD_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site
  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release') && vars.DLPAD_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish the reviewed site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
