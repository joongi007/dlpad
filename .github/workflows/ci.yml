name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
    outputs:
      windows_artifact_name:
        value: ${{ jobs.native.outputs.windows_artifact_name }}
      windows_artifact_id:
        value: ${{ jobs.native.outputs.windows_artifact_id }}
      source_sha:
        value: ${{ jobs.native.outputs.source_sha }}
  workflow_dispatch:
    inputs:
      include_other_platforms:
        description: Run deferred Linux and macOS checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    outputs:
      has_rust: ${{ steps.scope.outputs.has_rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate documentation and workspace contract
        run: python3 scripts/check_docs.py --source-only
      - name: Validate source-only documentation failure paths
        run: python3 scripts/test_check_docs.py
      - name: Validate isolated GUI probe safety
        run: python3 scripts/test_native_probe.py
      - name: Validate Windows dependency notice scope receipts
        run: python3 scripts/test_windows_dependency_notice_scope.py
      - name: Validate exact font package evidence bindings
        run: python3 scripts/test_windows_font_package_evidence.py
      - run: python3 scripts/test_windows_library_periodic_functional_native_probe.py
      - run: python3 scripts/test_windows_frame_resize_pixel_native_probe.py
      - run: python3 scripts/test_windows_library_watch_native_runner.py
      - name: Validate compiled SQL source binding and missing-input rejection
        run: python3 scripts/test_windows_snapshot_binding.py
      - name: Validate source export failure paths
        run: python3 scripts/test_export_source.py
      - name: Validate isolated local Git bundle guards
        run: python3 scripts/test_isolated_git_source_bundle.py
      - name: Validate CI registry original byte binding failure paths
        run: python3 scripts/test_ci_registry_source_binding.py
      - name: Validate incomplete CI graph format and failure paths
        run: python3 scripts/test_ci_notice_graph.py
      - name: Validate unsigned CI receipt format and path guards
        run: python3 scripts/test_ci_whole_receipt.py
      - name: Validate Windows CI orchestration failure paths
        run: python3 scripts/test_ci_whole_orchestrate.py
      - name: Validate bounded CI raw capture failure paths
        run: python3 scripts/test_ci_capture_operation.py
      - name: Validate isolated app-update fixture capture policy
        run: python3 scripts/test_ci_app_update_fixture.py
      - name: Validate CI-private compiler copy policy
        run: python3 scripts/test_prepare_ci_msvc.py
      - name: Validate unsigned update metadata rejection policy
        run: python3 scripts/test_update_candidate.py
      - name: Validate public site release selection and build isolation
        run: python3 scripts/test_build_site.py
      - name: Validate CI notice collection and preview packaging
        run: |
          python3 scripts/test_collect_ci_notices.py
          python3 scripts/test_package_ci_preview.py
      - name: Validate exact updater signatures and owned signer lifecycle
        run: |
          python3 scripts/test_sign_app_update.py
          python3 scripts/test_release_version.py
          python3 scripts/test_sign_local_app_update.py
      - name: Validate installer payload and ZIP failure paths
        run: python3 -m unittest discover -s scripts -p 'test_*install_payload.py'
      - name: Validate installer icon and manifest resources
        run: python3 scripts/test_installer_resources.py
      - name: Detect native workspace
        id: scope
        shell: bash
        run: |
          if test -f Cargo.toml; then
            echo 'has_rust=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_rust=false' >> "$GITHUB_OUTPUT"
            echo 'Native build skipped: no Rust workspace yet. Documentation checks only.' >> "$GITHUB_STEP_SUMMARY"
          fi

  native:
    needs: docs
    outputs:
      windows_artifact_name: windows-development-build-inputs-${{ github.sha }}
      windows_artifact_id: ${{ steps.windows-artifact.outputs.artifact-id }}
      source_sha: ${{ github.sha }}
    if: needs.docs.outputs.has_rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_other_platforms && '["windows-2022", "ubuntu-24.04", "macos-14"]' || '["windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Match validated local CI: keep assertions/checks, omit dev/test symbols and incremental storage.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev fonts-noto-cjk
      - name: Load pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
      - name: Validate Windows capture process ownership and diagnostics
        if: runner.os == 'Windows'
        run: python scripts/test_ci_capture_operation.py
      - name: Validate local update-key protection with synthetic data
        if: runner.os == 'Windows'
        run: python scripts/test_windows_update_key.py
      - name: Fetch exact lock dependencies
        run: cargo fetch --locked
      - name: Link the Windows C runtime into standalone candidates
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Prepare CI-private Windows compiler without telemetry helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare_ci_msvc.ps1
      - name: Snapshot Windows tracked source before compilation
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/ci_whole_orchestrate.py before --root "$GITHUB_WORKSPACE" --directory ci-captures
      - name: Formatting
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p ci-captures
            python scripts/ci_capture_operation.py --root "$GITHUB_WORKSPACE" --directory ci-captures --name fmt
          else
            cargo fmt --all -- --check
          fi
      - name: Lint
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p ci-captures
            python scripts/ci_capture_operation.py --root "$GITHUB_WORKSPACE" --directory ci-captures --name clippy
          else
            cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          fi
      - name: Build Windows process guardian for native acceptance
        if: runner.os == 'Windows'
        run: cargo build -p dlpad-engine --bin dlpad-process-guard --locked --offline
      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p ci-captures
            python scripts/ci_capture_operation.py --root "$GITHUB_WORKSPACE" --directory ci-captures --name test
          else
            cargo test --workspace --locked --offline
          fi
      - name: Release build
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            python scripts/ci_capture_operation.py --root "$GITHUB_WORKSPACE" --directory ci-captures --name release
          else
            cargo build --workspace --release --locked --offline 2>&1 | tee native-build.log
          fi
      - name: Alternative renderer compile
        run: cargo build -p dlpad --bin dlpad-egui-spike --features alternative --release --locked --offline
      - name: CPU candidate lint
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --features dlpad/cpu --all-targets --locked --offline -- -D warnings
      - name: CPU candidate tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --features dlpad/cpu --locked --offline
      - name: CPU candidate release
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p ci-captures
            python scripts/ci_capture_operation.py --root "$GITHUB_WORKSPACE" --directory ci-captures --name cpu-release
          else
            cargo build -p dlpad --bin dlpad-cpu --features cpu --release --locked --offline
          fi
      # Compile evidence only: these files are not a packaged install payload.
      - name: Windows development installer release compile
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/ci_capture_operation.py --root "$GITHUB_WORKSPACE" --directory ci-captures --name installer-release
      - name: Windows development companion release compile
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/ci_capture_operation.py --root "$GITHUB_WORKSPACE" --directory ci-captures --name companion-release
      - name: Build isolated signed app-update regression fixture
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/ci_app_update_fixture.py --root "$GITHUB_WORKSPACE" --directory ci-update-captures --phase build --seconds 300
      - name: Verify signed update activation and recovery
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/ci_app_update_fixture.py --root "$GITHUB_WORKSPACE" --directory ci-update-captures --phase run --owned-parent "$RUNNER_TEMP" --seconds 450
      - name: Bind Windows source and raw operation lifecycles
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/ci_whole_orchestrate.py after --root "$GITHUB_WORKSPACE" --directory ci-captures
      - name: Record unsigned Windows build input hashes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('target/release/dlpad-cpu.exe', 'target/release/dlpad-install.exe', 'target/release/dlpad-local-install.exe', 'target/release/dlpad-process-guard.exe', 'Cargo.lock', 'rust-toolchain.toml')
          "development_only=true`nrelease_ready=false`nsigned_distribution=false`npackaged_install_payload=false`ncommit=$env:GITHUB_SHA`nrun_id=$env:GITHUB_RUN_ID" | Set-Content -LiteralPath windows-development-build-inputs.txt -Encoding utf8
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing build input: $file" }
            $item = Get-Item -LiteralPath $file
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$file bytes=$($item.Length) sha256=$hash" | Add-Content -LiteralPath windows-development-build-inputs.txt -Encoding utf8
          }
      - name: Record Windows graph format inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & cargo tree --locked --offline --target x86_64-pc-windows-msvc --features cpu -p dlpad --edges normal,build --prefix none --format '{p}' --charset ascii 2> ci-app-tree.stderr.txt | Out-File -LiteralPath ci-app-tree.stdout.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "App dependency graph failed" }
          & cargo tree --locked --offline --target x86_64-pc-windows-msvc -p dlpad-engine --edges normal,build --prefix none --format '{p}' --charset ascii 2> ci-engine-tree.stderr.txt | Out-File -LiteralPath ci-engine-tree.stdout.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Engine dependency graph failed" }
          & cargo metadata --locked --offline --format-version 1 --filter-platform x86_64-pc-windows-msvc --features cpu 2> ci-metadata.stderr.txt | Out-File -LiteralPath ci-metadata.stdout.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Dependency metadata failed" }
          & python scripts/ci_notice_graph.py --app-tree ci-app-tree.stdout.txt --engine-tree ci-engine-tree.stdout.txt --metadata ci-metadata.stdout.json --lock Cargo.lock --output ci-graph-format.json
          if ($LASTEXITCODE -ne 0) { throw "Dependency format binding failed" }
      - name: Collect original license bytes for Windows preview packages
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/collect_ci_notices.py --root "$GITHUB_WORKSPACE" --graph ci-graph-format.json --metadata ci-metadata.stdout.json --lock Cargo.lock --whole ci-captures/whole.json --output ci-notices
      - name: Preserve unsigned Windows development build inputs
        id: windows-artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-development-build-inputs-${{ github.sha }}
          path: |
            target/release/dlpad-cpu.exe
            target/release/dlpad-install.exe
            target/release/dlpad-local-install.exe
            target/release/dlpad-process-guard.exe
            Cargo.lock
            rust-toolchain.toml
            windows-development-build-inputs.txt
            ci-graph-format.json
            ci-notices/
            ci-captures/
            ci-*.stdout.*
            ci-*.stderr.txt
          if-no-files-found: error
          retention-days: 7
      - name: GPU renderer compile
        run: cargo build -p dlpad --bin dlpad --no-default-features --features gpu --release --locked --offline
      - name: Package original Windows binaries for installer and portable review
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, sys, tomllib
          sys.path.insert(0, 'scripts')
          import package_ci_preview
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          version = tomllib.loads((root/'Cargo.toml').read_text())['workspace']['package']['version']
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / ('dlpad-preview-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          package_ci_preview.package(root, root, root/'ci-notices', os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'], version, output)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('DLPAD_PREVIEW_OUTPUT='+str(output)+'\n')
          PY
      - name: Preserve installable unsigned Windows preview candidates
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-preview-candidates-${{ github.sha }}
          path: ${{ env.DLPAD_PREVIEW_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve isolated updater regression evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-update-regression-${{ github.sha }}
          path: ci-update-captures/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log-${{ matrix.os }}
          path: |
            native-build.log
            ci-msvc-copy.json
            ci-captures/
          if-no-files-found: ignore
          retention-days: 7
