[package]
name = "dlpad-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
app-update-fixture = []
active-selection-control-fixture = []
library-scan-closewait-fixture = []
library-scan-profile-fixture = []
default = []
report-closewait-fixture = []
[dependencies]
dlpad-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.38", features = ["bundled"] }
directories = "6"
notify = "8.2"
sha2 = "0.10"
ring = "=0.17.14"
rawzip = "=0.5.1"
lzma-rust2 = { version = "=0.21.0", default-features = false, features = ["std", "xz"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[[bin]]
name = "app-update-fixture"
path = "src/bin/app_update_fixture.rs"
required-features = ["app-update-fixture"]
