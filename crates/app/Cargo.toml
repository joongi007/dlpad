[package]
name = "dlpad"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
first-paint-fixture = ["cpu", "dep:windows-sys"]
ime-compose-fixture = ["cpu", "dep:windows-sys"]
ime-owner-fixture = ["cpu", "dep:windows-sys"]
library-scan-closewait-fixture = ["dlpad-engine/library-scan-closewait-fixture", "dep:windows-sys"]
default = ["software"]
report-closewait-fixture = ["dlpad-engine/report-closewait-fixture", "dep:windows-sys"]
software = ["iced/tiny-skia"]
gpu = ["iced/wgpu"]
alternative = ["dep:eframe"]
cpu = ["dep:windows", "dep:windows-sys", "alternative", "dep:egui-winit", "dep:egui_software_backend", "dep:softbuffer", "dep:winit", "dep:bytemuck"]
[dependencies]
dlpad-core = { path = "../core" }
dlpad-engine = { path = "../engine" }
iced = { version = "=0.14.0", default-features = false, features = ["x11", "wayland", "thread-pool"] }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }

[[bin]]
name = "dlpad"
path = "src/main.rs"

[[bin]]
name = "dlpad-egui-spike"
path = "src/egui_spike.rs"
required-features = ["alternative"]

[[bin]]
name = "dlpad-accessible"
path = "src/accessible_main.rs"
required-features = ["alternative"]

# CPU renderer experiment: reuse egui 0.33.3 and AccessKit; no external winit helper.
[dependencies.egui-winit]
version = "=0.33.3"
optional = true
default-features = false
features = ["accesskit", "x11", "wayland", "clipboard", "links"]

[dependencies.egui_software_backend]
version = "=0.0.2"
optional = true
default-features = false
features = ["std"]

[dependencies.softbuffer]
version = "=0.4.8"
optional = true
default-features = false
features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"]

[dependencies.winit]
version = "=0.30.13"
optional = true
default-features = false
features = ["rwh_06", "x11", "wayland", "wayland-dlopen"]

[dependencies.bytemuck]
version = "=1.25.2"
optional = true

[[bin]]
name = "dlpad-cpu"
path = "src/accessible_cpu_main.rs"
required-features = ["cpu"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", optional = true, features = ["Win32_System_SystemInformation", "Win32_System_StationsAndDesktops", "Win32_System_JobObjects", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_System_Memory", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "dlpad-install"
path = "src/installer_main.rs"
required-features = ["cpu"]
